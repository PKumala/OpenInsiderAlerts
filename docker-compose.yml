services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: insider
      POSTGRES_PASSWORD: insider
      POSTGRES_DB: insider
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    working_dir: /code/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://insider:insider@db:5432/insider
    depends_on:
      - db
    ports:
      - "8000:8000"

  worker_core:
    build: .
    working_dir: /code/backend
    command: python -m app.scheduler.worker_core
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg://insider:insider@db:5432/insider

  worker_extended:
    build: .
    working_dir: /code/backend
    command: python -m app.scheduler.worker_extended
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg://insider:insider@db:5432/insider

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  pgdata:
